{% extends "admin_base.html" %}
{% block title %}{{ 'Bedel Musharrax' if candidate else 'Ku dar Musharrax' }}{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-2xl font-bold mb-6">{{ 'Bedel Musharrax' if candidate else 'Ku dar Musharrax' }}</h1>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">Magaca</label>
            <input type="text" name="name" required value="{{ candidate.name if candidate else '' }}"
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Xilka (Position)</label>
            <select name="position_id" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                {% for p in positions %}
                    <option value="{{ p.id }}" {% if candidate and candidate.position_id == p.id %}selected{% endif %}>{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Student ID (optional)</label>
            <input type="text" name="student_id" value="{{ candidate.student_id if candidate else '' }}"
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Sawirka URL (optional)</label>
            <input type="text" name="photo_url" value="{{ candidate.photo_url if candidate else '' }}"
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="https://example.com/photo.jpg">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Manifesto</label>
            <textarea name="manifesto" rows="4"
                      class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">{{ candidate.manifesto if candidate else '' }}</textarea>
        </div>
        <div class="flex gap-3">
            <button type="submit" class="bg-indigo-600 text-white font-semibold px-6 py-2.5 rounded-lg hover:bg-indigo-700">Kaydi</button>
            <a href="{{ url_for('admin_candidates') }}" class="px-6 py-2.5 rounded-lg bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200">Jooji</a>
        </div>
    </form>
</div>

{% endblock %}
