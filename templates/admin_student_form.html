{% extends "admin_base.html" %}
{% block title %}{{ 'Bedel Arday' if student else 'Ku dar Arday' }}{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-2xl font-bold mb-6">{{ 'Bedel Arday' if student else 'Ku dar Arday' }}</h1>
    <form method="POST" class="space-y-4">
        {% if not student %}
        <div>
            <label class="block text-sm font-medium mb-1">Student ID</label>
            <input type="text" name="student_id" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        {% endif %}
        <div>
            <label class="block text-sm font-medium mb-1">Magaca</label>
            <input type="text" name="name" required value="{{ student.name if student else '' }}"
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" name="email" required value="{{ student.email if student else '' }}"
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Password {{ '(faridaan haddii aad beddelayso)' if student else '' }}</label>
            <input type="password" name="password" {% if not student %}required{% endif %}
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="flex gap-3">
            <button type="submit" class="bg-indigo-600 text-white font-semibold px-6 py-2.5 rounded-lg hover:bg-indigo-700">Kaydi</button>
            <a href="{{ url_for('admin_students') }}" class="px-6 py-2.5 rounded-lg bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200">Jooji</a>
        </div>
    </form>
</div>

{% endblock %}
