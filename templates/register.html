{% extends "base.html" %}
{% block title %}Isdiiwaangeli — Codbixinta Ardayda{% endblock %}
{% block content %}

<div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-2xl font-bold mb-2 text-center">Isdiiwaangeli</h1>
    <p class="text-sm text-slate-500 text-center mb-6">Abuur xisaab arday si aad ugu codeyso</p>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1" for="student_id">Student ID</label>
            <input type="text" name="student_id" id="student_id" required
                   value="{{ form.get('student_id', '') }}"
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="Student ID-gaaga">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1" for="name">Magaca (Full Name)</label>
            <input type="text" name="name" id="name" required
                   value="{{ form.get('name', '') }}"
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1" for="email">Email</label>
            <input type="email" name="email" id="email" required
                   value="{{ form.get('email', '') }}"
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1" for="password">Password</label>
            <input type="password" name="password" id="password" required
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1" for="confirm">Xaqiiji Password</label>
            <input type="password" name="confirm" id="confirm" required
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700">Isdiiwaangeli</button>
    </form>
    <p class="text-sm text-center mt-4">
        Horey xisaab baad u haysataa?
        <a href="{{ url_for('login') }}" class="text-indigo-600 font-medium hover:underline">Ku soo gal</a>
    </p>
</div>

{% endblock %}
