{% extends "admin_base.html" %}
{% block title %}Xilalka — Admin{% endblock %}
{% block content %}

<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Maareynta Xilalka</h1>
    <a href="{{ url_for('admin_position_add') }}" class="bg-indigo-600 text-white font-semibold px-5 py-2.5 rounded-lg hover:bg-indigo-700">+ Ku dar Xil</a>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-600">
            <tr>
                <th class="text-left px-4 py-3">Magaca</th>
                <th class="text-left px-4 py-3">Sharaxaad</th>
                <th class="text-right px-4 py-3">Tallaabo</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
            {% for p in positions %}
                <tr>
                    <td class="px-4 py-3 font-medium">{{ p.name }}</td>
                    <td class="px-4 py-3 text-slate-600">{{ p.description }}</td>
                    <td class="px-4 py-3 text-right space-x-2">
                        <a href="{{ url_for('admin_position_edit', pid=p.id) }}" class="text-indigo-600 font-medium hover:underline">Bedel</a>
                        <form method="POST" action="{{ url_for('admin_position_delete', pid=p.id) }}" class="inline"
                              onsubmit="return confirm('Ma hubtaa inaad tirtirto xilkan?');">
                            <button class="text-rose-600 font-medium hover:underline">Tirtir</button>
                        </form>
                    </td>
                </tr>
            {% else %}
                <tr><td colspan="3" class="px-4 py-6 text-center text-slate-500">Ma jiraan xilal.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
