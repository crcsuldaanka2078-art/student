{% extends "base.html" %}
{% block title %}Admin Login — Codbixinta Ardayda{% endblock %}
{% block content %}

<div class="max-w-md mx-auto bg-slate-900 rounded-2xl shadow-lg border border-slate-800 p-8">
    <div class="flex justify-center mb-4">
        <span class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-white text-2xl">🛠️</span>
    </div>
    <h1 class="text-2xl font-bold mb-6 text-center text-white">Admin Login</h1>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1 text-slate-300" for="username">Username</label>
            <input type="text" name="username" id="username" required
                   class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1 text-slate-300" for="password">Password</label>
            <input type="password" name="password" id="password" required
                   class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700">Gal</button>
    </form>
</div>

{% endblock %}
