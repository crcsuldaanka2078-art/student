{% extends "base.html" %}
{% block title %}Ku soo gal — Codbixinta Ardayda{% endblock %}
{% block content %}

<div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-2xl font-bold mb-6 text-center">Ku soo gal</h1>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1" for="student_id">Student ID</label>
            <input type="text" name="student_id" id="student_id" required
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="Tusaale: STU001">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1" for="password">Password</label>
            <input type="password" name="password" id="password" required
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700">Ku soo gal</button>
    </form>
    <p class="text-sm text-center mt-4">
        Ma haysatid xisaab?
        <a href="{{ url_for('register') }}" class="text-indigo-600 font-medium hover:underline">Isdiiwaangeli</a>
    </p>
</div>

{% endblock %}
